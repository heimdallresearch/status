# Heimdall Research public status (Upptime)
# https://upptime.js.org/docs/configuration
owner: heimdallresearch
repo: status

sites:
  - name: Website
    url: https://heimdallresearch.com
  - name: API
    url: https://api.heimdallresearch.com/healthz
  - name: App
    url: https://app.heimdallresearch.com
  # - name: Docs
  #   url: https://docs.heimdallresearch.com

# No assignees for downtime issues.
assignees: []

# Downtime alerts use repository Actions secrets.
secrets:
  - NOTIFICATION_EMAIL
  - NOTIFICATION_EMAIL_FROM
  - NOTIFICATION_EMAIL_TO
  - NOTIFICATION_EMAIL_SMTP
  - NOTIFICATION_EMAIL_SMTP_HOST
  - NOTIFICATION_EMAIL_SMTP_PORT
  - NOTIFICATION_EMAIL_SMTP_USERNAME
  - NOTIFICATION_EMAIL_SMTP_PASSWORD

status-website:
  cname: status.heimdallresearch.com
  name: Heimdall Research status
  introTitle: "Service status"
  introMessage: "Live status of the Heimdall Research website, API, and customer app. Checked every five minutes."
  logoUrl: https://heimdallresearch.com/favicon.svg
  navbar:
    - title: Status
      href: /
    - title: Website
      href: https://heimdallresearch.com
    - title: GitHub
      href: https://github.com/heimdallresearch/status
    # Add at October launch when Docs monitoring is enabled:
    # - title: Docs
    #   href: https://docs.heimdallresearch.com
